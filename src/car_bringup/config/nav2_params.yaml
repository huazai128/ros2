# Minimal Nav2 frame/topic override. Merge with your distribution's nav2_params.yaml
# if your platform needs the full parameter set.
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
controller_server:
  ros__parameters:
    odom_topic: /odom
